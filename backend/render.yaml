services:
  - type: web
    name: nestmatch-backend
    env: python
    rootDir: "."
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    autoDeploy: true
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://your-netlify-site.netlify.app
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FORCE_SQLITE
        value: "true"
